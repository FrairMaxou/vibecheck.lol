[project]
name = "league-of-vibecheck"
version = "0.1.10"
description = "Tracks whether you're actually having fun playing League of Legends."
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# E/F/W pycodestyle+pyflakes, I import order, B bugbear, UP modernize, S security (bandit)
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = [
    # S501: TLS verification is intentionally disabled for the LCU's
    # self-signed cert on 127.0.0.1 (see vibecheck/lcu.py) — local-only traffic.
    "S501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are the point of tests
"tools/dev_dashboard.py" = ["S311"]  # random is for fake demo data, not crypto
