name: Release

# Normally invoked by release-please.yml once a Release PR merges. The tag
# triggers stay as an escape hatch for a hand-cut release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch: # manual runs produce an artifact without a release
  workflow_call:
    inputs:
      tag:
        description: Tag of the release already created by release-please.
        type: string
        required: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # needed to create the release
    steps:
      # `inputs.tag` is empty for the push/dispatch triggers, which makes this a
      # no-op and checks out the ref that triggered the run.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Verify before building
        run: |
          ruff check .
          python tests/smoke_test.py

      # The publishable key is public-by-design but kept out of the repo so bots
      # don't find the endpoint. See docs/RELEASE.md. Secrets are mapped to env
      # first: GitHub does not reliably allow the `secrets` context inside `if:`,
      # so we gate on an env var (which does work) to guarantee this runs when
      # the credentials are configured.
      - name: Bake backend credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        if: ${{ env.SUPABASE_URL != '' }}
        shell: pwsh
        run: |
          "SUPABASE_URL = '$env:SUPABASE_URL'"           | Out-File vibecheck/_bundled.py -Encoding utf8
          "SUPABASE_KEY = '$env:SUPABASE_PUBLISHABLE_KEY'" | Out-File vibecheck/_bundled.py -Encoding utf8 -Append

      - name: Build exe
        run: pyinstaller vibecheck.spec --noconfirm

      - name: Smoke-test the exe
        shell: pwsh
        run: |
          $env:VIBECHECK_PORT = "8590"
          $p = Start-Process dist/VibeCheck.exe -PassThru
          Start-Sleep -Seconds 20
          if (-not (Get-Process -Id $p.Id -ErrorAction SilentlyContinue)) {
            throw "exe exited on startup"
          }
          # Bundled web assets must resolve from the PyInstaller temp dir.
          $r = Invoke-WebRequest "http://127.0.0.1:8590/" -UseBasicParsing -TimeoutSec 10
          if ($r.StatusCode -ne 200) { throw "dashboard did not serve" }
          Invoke-WebRequest "http://127.0.0.1:8590/static/app.js" -UseBasicParsing -TimeoutSec 10 | Out-Null
          Stop-Process -Id $p.Id -Force
          Write-Host "exe smoke test passed"

      # The in-app updater refuses to install a build it can't verify, so this
      # file is what makes self-update possible at all. Format matches
      # `sha256sum` so it's checkable by hand too.
      - name: Publish checksums
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/VibeCheck.exe -Algorithm SHA256).Hash.ToLower()
          "$h  VibeCheck.exe" | Out-File dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: VibeCheck
          path: dist/VibeCheck.exe

      # Called from release-please the release already exists with the changelog
      # as its body, so append rather than replace it — and don't ask GitHub to
      # regenerate notes on top of notes.
      - name: Publish release
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            dist/VibeCheck.exe
            dist/SHA256SUMS.txt
          append_body: true
          generate_release_notes: ${{ inputs.tag == '' }}
          body: |
            ## Install
            Download **VibeCheck.exe** below and double-click it.

            Windows will warn that the app isn't code-signed — click
            **More info → Run anyway**. The VibeCheck icon appears in your
            system tray; that means it's running. Play a game and it'll ask
            how it went.

            See the [README](../../blob/main/README.md) for the full guide.
