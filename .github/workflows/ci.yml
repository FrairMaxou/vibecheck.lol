name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # We squash-merge, so the PR title — not the branch's commits — is what lands
  # on main. This is the only place that can enforce the convention on history.
  pr-title:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          # Scope is optional, but a typo'd one is worse than none: an unknown
          # scope fragments the changelog into categories nobody reads.
          requireScope: false
          scopes: |
            capture
            lcu
            store
            app
            popup
            tray
            dashboard
            web
            sync
            telemetry
            updater
            startup
            config
            brand
            release
            deps
            deps-dev
          # Release PRs are titled `chore(release): vX.Y.Z`; everything else
          # should read as a sentence, so no capitalised first word.
          subjectPattern: ^(?![A-Z]).+$
          subjectPatternError: |
            The subject "{subject}" is not formatted correctly: start it
            lowercase and describe what changed, e.g.
            "fix(capture): handle Arena subteam payloads".

  checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Compile check
        run: python -m compileall -q vibecheck
      # Runs on windows-latest for a reason: the guarantee that a locked data
      # folder falls back instead of starting empty only holds on Windows, and
      # Windows is the only platform we ship.
      - name: Data folder migration
        run: python tests/migration_test.py
      - name: Smoke test
        run: python tests/smoke_test.py
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt
