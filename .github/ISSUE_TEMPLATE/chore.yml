name: Chore / maintenance
description: Refactor, docs, tooling, CI, release plumbing
labels: ["chore"]
body:
  - type: textarea
    id: what
    attributes:
      label: What needs doing
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why now
      description: >
        What breaks, slows down, or stays risky if this waits. Chores without an
        answer here tend to sit in the backlog forever — that's fine, but say so.

  - type: textarea
    id: done
    attributes:
      label: Done when
      description: The check that tells you it's finished.
