repos:
  # Keep this in step with the ruff floor in requirements-dev.txt. The hook
  # pins its own ruff, so letting the two drift means a commit the hook passes
  # can still fail CI on a rule the newer ruff added.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # `ruff-check`, not `ruff`: the bare id is a deprecated alias on this
      # version and is slated for removal.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.3
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
