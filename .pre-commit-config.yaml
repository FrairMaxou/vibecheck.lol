# `commit-msg` is not installed by default, and the Conventional Commits check
# only runs at that stage — without this line `pre-commit install` silently
# leaves commit messages unchecked.
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Conventional Commits. CI checks the *PR title* separately, because we
  # squash-merge: the PR title is what actually lands on main, so both need
  # guarding to keep the history parseable.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # Keep this in step with the ruff floor in requirements-dev.txt. The hook
  # pins its own ruff, so letting the two drift means a commit the hook passes
  # can still fail CI on a rule the newer ruff added.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      # `ruff-check`, not `ruff`: the bare id is a deprecated alias on this
      # version and is slated for removal.
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.23.3
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
